name: ci

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      CUDA_VISIBLE_DEVICES: ""
      CI_UV_VERSION: "0.11.16"
      PDOMAIN_OPS_REF: "2d01f1d2fee7fbdb2bd5a19e28182e949330cfd3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
        with:
          repository: pdomain/pdomain-ops
          ref: ${{ env.PDOMAIN_OPS_REF }}
          path: pdomain-ops
          persist-credentials: false
      - name: Link pdomain-ops path dependency
        run: ln -sfn "$PWD/pdomain-ops" ../pdomain-ops
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.3
      - run: make ci PYTHON_VERSIONS="${{ matrix.python-version }}"
