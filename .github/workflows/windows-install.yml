# Manual Windows install test. Start it with `just win-test`.
#
# It runs install.ps1 the way a user would, piped into Invoke-Expression in
# Windows PowerShell 5.1, then OCRs a real book page and compares the text with
# its proofread text. GitHub's Windows runners are x64 virtual machines
# with no GPU, where the job runs as an administrator and the Visual C++
# runtime is already present. So this covers the CPU path; the UAC prompt and
# the runtime install still need a real Windows machine.
name: Windows install test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows runner image (both are x64)
        type: choice
        options:
          - windows-2025
          - windows-2022
        default: windows-2025

permissions:
  contents: read

concurrency:
  group: windows-install-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  install:
    name: Install and OCR on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      # install.ps1 asks the GitHub API for the latest release; the token
      # avoids the anonymous rate limit.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Put uv's tool directory on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"

      - name: Install the latest release with install.ps1 in Windows PowerShell
        shell: powershell
        run: Get-Content -Raw .\install.ps1 | Invoke-Expression

      - name: Report the installed environment
        shell: pwsh
        run: |
          pdomain-ocr --version
          $toolPython = Join-Path (uv tool dir) "pdomain-ocr-cli\Scripts\python.exe"
          $code = @'
          import importlib.metadata as metadata
          import platform
          import sys

          import torch

          print("python", platform.python_version(), platform.machine())
          for name in ("pdomain-ocr-cli", "pdomain-book-tools", "torch", "python-doctr"):
              print(name, metadata.version(name))
          print("cuda available", torch.cuda.is_available())
          opencv = sorted(
              d.metadata["Name"]
              for d in metadata.distributions()
              if d.metadata["Name"].lower().startswith("opencv")
          )
          print("opencv distributions", opencv)
          if opencv != ["opencv-python"]:
              sys.exit(f"expected only opencv-python, found {opencv}")
          import cv2

          print("cv2", cv2.__version__)
          '@
          $code | & $toolPython -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: OCR the book page fixture
        shell: pwsh
        run: pdomain-ocr --no-update-check --output-dir ocr-out tests\fixtures\book_page.png

      # The page is a real public-domain book page with Distributed
      # Proofreaders' proofread text; the Linux release reads it at 0.987.
      # A difference from the Linux output is reported as a warning only.
      - name: Compare the OCR text with the proofread text
        shell: pwsh
        run: |
          $code = @'
          import difflib
          import re
          import sys
          from collections import Counter
          from pathlib import Path

          got_path, proofread_path, linux_path = sys.argv[1:4]

          def text(path):
              return Path(path).read_text(encoding="utf-8")

          def words(path):
              return Counter(re.findall(r"\w+", text(path).lower()))

          got, proofread = words(got_path), words(proofread_path)
          total = sum(proofread.values())
          overlap = sum((got & proofread).values()) / max(1, total)
          print(f"word overlap with the proofread text: {overlap:.3f} of {total} words")

          linux = [line.rstrip() for line in text(linux_path).strip().splitlines()]
          here = [line.rstrip() for line in text(got_path).strip().splitlines()]
          if here == linux:
              print(f"OCR output matches {linux_path} exactly")
          else:
              print(f"::warning::OCR output differs from {linux_path}")
              print("\n".join(difflib.unified_diff(linux, here, "Linux release output", "this runner", lineterm="")))

          if overlap < 0.95:
              sys.exit("word overlap with the proofread text is below 0.95")
          '@
          $code | python -I - ocr-out\book_page.txt tests\fixtures\book_page.pgdp.txt tests\fixtures\book_page.release-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the OCR output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ocr-${{ inputs.runner }}
          path: ocr-out/
          if-no-files-found: ignore
