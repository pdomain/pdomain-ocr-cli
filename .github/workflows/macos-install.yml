# Manual macOS install test. Start it with `just mac-test`.
#
# It installs the latest published release the way a user would, with
# install.sh, then OCRs one fixture page and checks the text. GitHub's macOS
# runners are Apple Silicon virtual machines; the job reports whether PyTorch
# sees MPS, and passes on the CPU path when it does not.
name: macOS install test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image (both are Apple Silicon)
        type: choice
        options:
          - macos-26
          - macos-15
        default: macos-26

permissions:
  contents: read

concurrency:
  group: macos-install-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  install:
    name: Install and OCR on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      # install.sh asks the GitHub API for the latest release; the token
      # avoids the anonymous rate limit.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Put uv's tool directory on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the latest release with install.sh
        run: sh install.sh

      - name: Report the installed environment
        run: |
          pdomain-ocr --version
          tool_python="$(uv tool dir)/pdomain-ocr-cli/bin/python"
          "$tool_python" -I - <<'PY'
          import importlib.metadata as metadata
          import platform
          import sys

          import torch

          print("python", platform.python_version(), platform.machine())
          for name in ("pdomain-ocr-cli", "pdomain-book-tools", "torch", "python-doctr"):
              print(name, metadata.version(name))
          print("mps available", torch.backends.mps.is_available())
          opencv = sorted(
              d.metadata["Name"]
              for d in metadata.distributions()
              if d.metadata["Name"].lower().startswith("opencv")
          )
          print("opencv distributions", opencv)
          if opencv != ["opencv-python"]:
              sys.exit(f"expected only opencv-python, found {opencv}")
          import cv2

          print("cv2", cv2.__version__)
          PY

      - name: OCR the title page fixture
        run: pdomain-ocr --no-update-check --output-dir ocr-out tests/fixtures/title_page_001.png

      - name: Compare the OCR text with the expected text
        run: |
          python3 -I - ocr-out/title_page_001.txt tests/fixtures/title_page_001.expected.txt <<'PY'
          import re
          import sys
          from collections import Counter

          def words(path):
              with open(path, encoding="utf-8") as handle:
                  return Counter(re.findall(r"\w+", handle.read().lower()))

          got, expected = words(sys.argv[1]), words(sys.argv[2])
          overlap = sum((got & expected).values()) / max(1, sum(expected.values()))
          print(f"word overlap {overlap:.3f} ({sum(expected.values())} expected words)")
          if overlap < 0.9:
              sys.exit("word overlap is below 0.9")
          PY

      - name: Keep the OCR output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-ocr-${{ inputs.runner }}
          path: ocr-out/
          if-no-files-found: ignore
