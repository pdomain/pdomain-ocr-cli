# Manual macOS install test. Start it with `just mac-test`.
#
# It installs the latest published release the way a user would, with
# install.sh, then OCRs a 20-word test page and checks the text. GitHub's macOS
# runners are Apple Silicon virtual machines; the job reports whether PyTorch
# sees MPS, and passes on the CPU path when it does not.
name: macOS install test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image (both are Apple Silicon)
        type: choice
        options:
          - macos-26
          - macos-15
        default: macos-26

permissions:
  contents: read

concurrency:
  group: macos-install-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  install:
    name: Install and OCR on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      # install.sh asks the GitHub API for the latest release; the token
      # avoids the anonymous rate limit.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Put uv's tool directory on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the latest release with install.sh
        run: sh install.sh

      - name: Report the installed environment
        run: |
          pdomain-ocr --version
          tool_python="$(uv tool dir)/pdomain-ocr-cli/bin/python"
          "$tool_python" -I - <<'PY'
          import importlib.metadata as metadata
          import platform
          import sys

          import torch

          print("python", platform.python_version(), platform.machine())
          for name in ("pdomain-ocr-cli", "pdomain-book-tools", "torch", "python-doctr"):
              print(name, metadata.version(name))
          print("mps available", torch.backends.mps.is_available())
          opencv = sorted(
              d.metadata["Name"]
              for d in metadata.distributions()
              if d.metadata["Name"].lower().startswith("opencv")
          )
          print("opencv distributions", opencv)
          if opencv != ["opencv-python"]:
              sys.exit(f"expected only opencv-python, found {opencv}")
          import cv2

          print("cv2", cv2.__version__)
          PY

      - name: OCR the 20-word test page
        run: pdomain-ocr --no-update-check --output-dir ocr-out tests/fixtures/known_good_page.png

      # This proves the install runs OCR; it is not an OCR quality test.
      # known_good_page.png is the GUI's 20-word drawn test page. The run
      # fails only if under 0.6 of its words come back. A difference from
      # the Linux release output is reported as a warning.
      - name: Check the OCR text
        run: |
          python3 -I - ocr-out/known_good_page.txt \
            tests/fixtures/known_good_page.gt.txt \
            tests/fixtures/known_good_page.release-output.txt <<'PY'
          import difflib
          import re
          import sys
          from collections import Counter
          from pathlib import Path

          got_path, truth_path, linux_path = sys.argv[1:4]

          def text(path):
              return Path(path).read_text(encoding="utf-8")

          def words(path):
              return Counter(re.findall(r"\w+", text(path).lower()))

          got, truth = words(got_path), words(truth_path)
          total = sum(truth.values())
          overlap = sum((got & truth).values()) / max(1, total)
          print(f"word overlap with the ground truth: {overlap:.3f} of {total} words")

          linux = [line.rstrip() for line in text(linux_path).strip().splitlines()]
          here = [line.rstrip() for line in text(got_path).strip().splitlines()]
          if here == linux:
              print(f"OCR output matches {linux_path} exactly")
          else:
              print(f"::warning::OCR output differs from {linux_path}")
              print("\n".join(difflib.unified_diff(linux, here, "Linux release output", "this runner", lineterm="")))

          if overlap < 0.6:
              sys.exit("word overlap with the ground truth is below 0.6")
          PY

      - name: Keep the OCR output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-ocr-${{ inputs.runner }}
          path: ocr-out/
          if-no-files-found: ignore
